<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Позиции заказа - Управление рестораном</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
        .badge-category { font-size: 0.8em; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><i class="fas fa-utensils me-2"></i>Управление рестораном</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}"><i class="fas fa-home"></i> Главная</a>
            <a class="nav-link" th:href="@{/customers}"><i class="fas fa-users"></i> Клиенты</a>
            <a class="nav-link" th:href="@{/orders}"><i class="fas fa-shopping-cart"></i> Заказы</a>
            <a class="nav-link active" th:href="@{/order-items}"><i class="fas fa-list"></i> Позиции</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h3 class="card-title mb-0"><i class="fas fa-list me-2"></i>Позиции заказа</h3>
            <a th:href="@{/order-items/new}" class="btn btn-primary"><i class="fas fa-plus me-1"></i>Добавить позицию</a>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Заказ ID</th>
                        <th>Продукт</th>
                        <th>Категория</th>
                        <th>Размер</th>
                        <th>Цена</th>
                        <th>Кол-во</th>
                        <th>Итог</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${orderItems}">
                        <td th:text="${item.id}"></td>
                        <td>
                            <a th:href="@{/orders/details/{id}(id=${item.order.id})}"
                               class="badge bg-secondary">
                                <span th:text="${item.order.id}"></span>
                            </a>
                        </td>
                        <td>
                            <div th:text="${item.productName}"></div>
                            <small class="text-muted">ID: <span th:text="${item.productId}"></span></small>
                        </td>
                        <td>
            <span th:switch="${item.productCategory}" class="badge badge-category">
                <span th:case="'Напитки'" class="bg-primary" th:text="${item.productCategory}"></span>
                <span th:case="'Выпечка'" class="bg-warning text-dark" th:text="${item.productCategory}"></span>
                <span th:case="'Десерт'" class="bg-success" th:text="${item.productCategory}"></span>
                <span th:case="*" class="bg-info" th:text="${item.productCategory}"></span>
            </span>
                        </td>
                        <td>
                            <!-- Показываем размер только для напитков -->
                            <span th:if="${item.productCategory == 'Напитки' and item.productSize != null}"
                                  th:text="${item.productSize}"></span>
                            <span th:if="${item.productCategory == 'Напитки' and item.productSize == null}">-</span>
                            <span th:if="${item.productCategory != 'Напитки'}">-</span>
                        </td>
                        <td th:text="${#numbers.formatDecimal(item.basePrice, 1, 2)} + ' ₽'"></td>
                        <td>
                            <span class="badge bg-primary" th:text="${item.quantity}"></span>
                        </td>
                        <td>
                            <strong th:text="${#numbers.formatDecimal(item.finalPrice, 1, 2)} + ' ₽'"></strong>
                        </td>
                        <td>
                            <div class="btn-group">
                                <a th:href="@{/order-items/edit/{id}(id=${item.id})}" class="btn btn-sm btn-warning">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{/order-items/delete/{id}(id=${item.id})}" class="btn btn-sm btn-danger"
                                   onclick="return confirm('Удалить позицию?')">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${orderItems.empty}">
                        <td colspan="9" class="text-center text-muted py-4">
                            <i class="fas fa-list fa-2x mb-2"></i>
                            <p>Позиции заказа не найдены</p>
                            <a th:href="@{/order-items/new}" class="btn btn-primary">
                                <i class="fas fa-plus me-1"></i>Добавить позицию
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="alert alert-light border mt-4">
                <h6><i class="fas fa-chart-pie me-2"></i>Статистика позиций</h6>
                <div class="row">
                    <div class="col-md-3">Всего позиций: <strong th:text="${orderItems.size()}">0</strong></div>
                    <div class="col-md-3">Общее количество:
                        <strong th:text="${#aggregates.sum(orderItems.![quantity])}">0</strong>
                    </div>
                    <div class="col-md-3">Общая сумма:
                        <strong th:text="${#numbers.formatDecimal(
                #aggregates.sum(orderItems.![finalPrice]), 1, 2
            )} + ' ₽'">0 ₽</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
