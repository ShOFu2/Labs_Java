<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы - Управление рестораном</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
        .badge-payment { font-size: 0.8em; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><i class="fas fa-utensils me-2"></i>Управление рестораном</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}"><i class="fas fa-home"></i> Главная</a>
            <a class="nav-link" th:href="@{/customers}"><i class="fas fa-users"></i> Клиенты</a>
            <a class="nav-link active" th:href="@{/orders}"><i class="fas fa-shopping-cart"></i> Заказы</a>
            <a class="nav-link" th:href="@{/order-items}"><i class="fas fa-list"></i> Позиции</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h3 class="card-title mb-0"><i class="fas fa-shopping-cart me-2"></i>Управление заказами</h3>
            <a th:href="@{/orders/new}" class="btn btn-primary"><i class="fas fa-plus me-1"></i>Создать заказ</a>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Дата и время</th>
                        <th>Клиент</th>
                        <th>Сотрудник</th>
                        <th>Сумма</th>
                        <th>Оплата</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="${order.id}"></td>
                        <td>
                            <div th:text="${order.orderDate != null} ?
              ${#temporals.format(order.orderDate, 'dd.MM.yyyy')} :
              'Не указана'"></div>
                            <small class="text-muted" th:text="${order.orderTime}"></small>
                        </td>
                        <td th:text="${order.customer.customerName}"></td>
                        <td>
                            <div th:text="${order.employeeName}"></div>
                            <small class="text-muted">ID: <span th:text="${order.employeeId}"></span></small>
                        </td>
                        <td>
                            <strong th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)} + ' ₽'"></strong>
                        </td>
                        <td>
                            <span class="badge bg-info badge-payment" th:text="${order.paymentMethod}"></span>
                        </td>
                        <td>
                            <div class="btn-group">
                                <a th:href="@{/orders/edit/{id}(id=${order.id})}" class="btn btn-sm btn-warning">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{/orders/delete/{id}(id=${order.id})}" class="btn btn-sm btn-danger"
                                   onclick="return confirm('Удалить заказ?')">
                                    <i class="fas fa-trash"></i>
                                </a>
                                <a th:href="@{/orders/details/{id}(id=${order.id})}" class="btn btn-sm btn-info">
                                    <i class="fas fa-eye"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${orders.empty}">
                        <td colspan="7" class="text-center text-muted py-4">
                            <i class="fas fa-shopping-cart fa-2x mb-2"></i>
                            <p>Заказы не найдены</p>
                            <a th:href="@{/orders/new}" class="btn btn-primary">
                                <i class="fas fa-plus me-1"></i>Создать первый заказ
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="alert alert-light border mt-4">
                <h6><i class="fas fa-chart-bar me-2"></i>Статистика заказов</h6>
                <div class="row">
                    <div class="col-md-3">Всего заказов: <strong th:text="${orders.size()}">0</strong></div>
                    <div class="col-md-3">Общая сумма:
                        <strong th:text="${#numbers.formatDecimal(
                        #aggregates.sum(orders.![totalAmount]), 1, 2
                        )} + ' ₽'">0 ₽</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
